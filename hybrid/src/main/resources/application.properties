spring.application.name=hybrid
server.port=9090
spring.datasource.url=jdbc:mysql://localhost:3306/pos_system
spring.datasource.username=root
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
#logging.level.org.springframework.data.jpa.repository=DEBUG

# JWT authentication. jwt.secret MUST be overridden via the JWT_SECRET environment
# variable in any non-local environment - this default is for local development only.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-change-me-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ZIMRA Fiscalisation Configuration
zimra.business.tin=12345678
zimra.business.name=POS Online Shop
zimra.business.address=Harare, Zimbabwe
zimra.tax.rate=15.0
zimra.auto-fiscalise=true

# Legacy GL migration cutover switch - see AccountancyService's class comment. Leave true
# until LegacyGlReconciliationService's report has been run against real production data and
# shown clean; only then flip to false to stop writing new AccountancyEntry rows. All
# reporting already reads exclusively from the GL (JournalEntry/JournalLine) regardless of
# this setting - flipping it never changes what any report shows.
legacy-gl.dual-write-enabled=true

# Scheduled jobs - see ScheduledJobsService. Cron format: second minute hour day month weekday.
scheduled-jobs.reservation-expiry-minutes=60
scheduled-jobs.reservation-expiry-cron=0 0/15 * * * *
scheduled-jobs.overdue-invoice-check-cron=0 0 6 * * *


